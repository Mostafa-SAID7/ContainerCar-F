name: Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - name: Audit Dependencies
        run: npm audit
        continue-on-error: true
      
      - name: Check High Severity
        run: |
          npm audit --json > audit.json
          HIGH=$(cat audit.json | jq '.metadata.vulnerabilities.high // 0')
          CRITICAL=$(cat audit.json | jq '.metadata.vulnerabilities.critical // 0')
          
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Found high or critical vulnerabilities"
            exit 1
          fi
          echo "✅ No high/critical vulnerabilities"

  code-scanning:
    name: Code Scanning
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - run: npm ci || npm install
      
      - name: Check for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true
      
      - name: Check for Security Issues in Code
        run: |
          echo "🔍 Security scanning..."
          
          # Check for hardcoded API keys
          if grep -r "api_key\|API_KEY\|SECRET_KEY" src/ --include="*.ts" --include="*.tsx"; then
            echo "⚠️  Potential hardcoded secrets found"
            exit 1
          fi
          
          # Check for console logs in production
          if grep -r "console\." src/ --include="*.ts" --include="*.tsx" | grep -v "test\|spec"; then
            echo "⚠️  Console logs found in production code"
          fi
          
          echo "✅ Code security checks passed"

  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/bom
          cyclonedx-npm --output-file sbom.xml || npm ci || npm install
      
      - name: Check SBOM
        run: |
          echo "📦 SBOM Generated"
          echo "  Total dependencies analyzed"
          wc -l sbom.xml

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - run: npm ci || npm install
      
      - name: Check Licenses
        run: |
          echo "📜 License Compliance Check"
          npx license-report --csv > licenses.csv || true
          
          # Check for GPL dependencies (if not allowed)
          if grep -i "GPL" licenses.csv; then
            echo "⚠️  GPL dependencies found - review if compatible"
          fi
          
          echo "✅ License check completed"
