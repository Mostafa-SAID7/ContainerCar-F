name: Release & Versioning

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Validate Version Format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            exit 1
          fi
          echo "✅ Version: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint Check
        run: npm run lint || true

      - name: Build Production
        run: npm run build

      - name: Create Release Archive
        run: |
          mkdir -p release-artifacts
          cd dist/
          tar -czf ../release-artifacts/containercar-${{ steps.version.outputs.version }}.tar.gz .
          ls -lh ../release-artifacts/

      - name: Create Tag (if workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}" || true
          git push origin "${{ steps.version.outputs.tag }}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          body: |
            # Release v${{ steps.version.outputs.version }}

            **Type:** Container Business Platform MVP

            ## What's Included
            - ✅ Budget discovery tool
            - ✅ Business marketplace
            - ✅ Equipment checklist
            - ✅ Franchise information
            - ✅ Supplier network
            - ✅ Responsive design
            - ✅ Arabic & English support

            ## Links
            - [Repository](https://github.com/${{ github.repository }})
            - [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)

            ## Download
            Extract and deploy: `tar -xzf containercar-${{ steps.version.outputs.version }}.tar.gz`
          files: release-artifacts/containercar-${{ steps.version.outputs.version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "✅ Release Created!"
          echo ""
          echo "📦 Release v${{ steps.version.outputs.version }}"
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
          echo "📥 Download: containercar-${{ steps.version.outputs.version }}.tar.gz"
