name: Release & Versioning

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.1)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

env:
  NODE_VERSION: "20"

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Version Format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Use format: X.Y.Z (e.g., 1.0.1)"
            exit 1
          fi
          echo "✅ Version format valid: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate Code Quality
        run: npm run lint || true

      - name: Build Production Bundle
        run: npm run build

      - name: Create Release Tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Create annotated tag
          git tag -a "v$VERSION" -m "Release v$VERSION" || true

          # Push tag to remote
          git push origin "v$VERSION" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Archive
        run: |
          mkdir -p release-artifacts
          cd dist/
          tar -czf ../release-artifacts/containercar-${{ github.event.inputs.version }}.tar.gz .
          cd ../release-artifacts
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body: |
            # Release v${{ github.event.inputs.version }}

            **Release Type:** ${{ github.event.inputs.release_type }}

            ## What's New
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Installation
            ```bash
            npm install
            npm run build
            ```

            ## Download
            - **Build Artifact:** containercar-${{ github.event.inputs.version }}.tar.gz

            ## Links
            - [Repository](https://github.com/${{ github.repository }})
            - [Issues](https://github.com/${{ github.repository }}/issues)
            - [Pull Requests](https://github.com/${{ github.repository }}/pulls)
          files: |
            release-artifacts/containercar-${{ github.event.inputs.version }}.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release Summary
        run: |
          echo "✅ Release Created Successfully!"
          echo ""
          echo "📦 Release Information:"
          echo "  - Version: v${{ github.event.inputs.version }}"
          echo "  - Type: ${{ github.event.inputs.release_type }}"
          echo "  - URL: https://github.com/${{ github.repository }}/releases/tag/v${{ github.event.inputs.version }}"
          echo ""
          echo "📥 Download:"
          echo "  - Build: https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.version }}/containercar-${{ github.event.inputs.version }}.tar.gz"
