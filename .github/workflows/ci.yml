name: CI - Complete Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================================================
  # QUALITY CHECKS - Run first (fast fail)
  # ============================================================================
  
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - name: Install Dependencies
        run: npm ci || npm install
      
      - name: ESLint
        run: npm run lint
      
      - name: Prettier Format
        run: npx prettier --check .
      
      - name: TypeScript Check
        run: npx tsc --noEmit

  # ============================================================================
  # BUILD - Verify production build
  # ============================================================================
  
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - name: Install Dependencies
        run: npm ci || npm install
      
      - name: Build
        run: npm run build
      
      - name: Check Bundle Size
        run: |
          SIZE_KB=$(du -sk dist/ | cut -f1)
          SIZE_MB=$(echo "scale=2; $SIZE_KB / 1024" | bc)
          echo "📦 Bundle Size: ${SIZE_MB}MB"
          
          if [ $SIZE_KB -gt 512000 ]; then
            echo "⚠️  Bundle exceeds 500MB limit"
          fi
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: dist/
          retention-days: 1

  # ============================================================================
  # TESTING - Comprehensive test suite
  # ============================================================================
  
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - name: Install Dependencies
        run: npm ci || npm install
      
      - name: Run Unit Tests
        run: npm run test -- --run
      
      - name: Generate Coverage
        run: npm run test:coverage
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
        continue-on-error: true

  # ============================================================================
  # SECURITY - Scan for vulnerabilities
  # ============================================================================
  
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - name: Install Dependencies
        run: npm ci || npm install
      
      - name: Audit Dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
        continue-on-error: true

  # ============================================================================
  # PERFORMANCE - Lighthouse & metrics
  # ============================================================================
  
  performance:
    name: Performance Check
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      
      - name: Download Build
        uses: actions/download-artifact@v3
        with:
          name: build
          path: dist/
      
      - name: Check Build Integrity
        run: |
          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "❌ Build artifact missing or empty"
            exit 1
          fi
          echo "✅ Build artifact verified"

  # ============================================================================
  # SUMMARY - All checks must pass
  # ============================================================================
  
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [quality, build, test, security, performance]
    if: always()
    
    steps:
      - name: Verify All Jobs Passed
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.performance.result }}" != "success" ]; then
            echo "❌ Some checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
