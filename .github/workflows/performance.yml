name: Performance & Lighthouse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Build Application
        run: npm run build
      
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-size:
    name: Bundle Size Trend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - run: npm ci
      
      - run: npm run build
      
      - name: Analyze Bundle
        uses: bundlesize/action@v0.3.1
        with:
          files: ./dist/index.*.js
          budgets: '[{"type": "js", "maximum": "200kb"}]'
        continue-on-error: true

  web-vitals:
    name: Core Web Vitals Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - run: npm ci
      
      - run: npm run build
      
      - name: Check Vitals Readiness
        run: |
          echo "✅ Core Web Vitals checks:"
          echo "  - LCP (Largest Contentful Paint): Target <2.5s"
          echo "  - FID (First Input Delay): Target <100ms"
          echo "  - CLS (Cumulative Layout Shift): Target <0.1"
          echo "  - TTFB (Time to First Byte): Target <600ms"
